<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>YBF ホームページ案</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans JP","Hiragino Sans",sans-serif;background:#f2f4f7;color:#1c2733;line-height:1.8}
.wrap{max-width:960px;margin-inline:auto;padding:48px 20px 64px}
h1{font-size:24px;margin:0 0 6px}
.lead{color:#5a6b7d;margin:0 0 32px;font-size:15px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{display:block;background:#fff;border-radius:14px;overflow:hidden;border:1px solid #d9e2ec;color:inherit;text-decoration:none;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(14,42,76,.12)}
.card .thumb{aspect-ratio:16/10;display:flex;align-items:flex-end;padding:20px;font-weight:700;font-size:22px;color:#fff;background-size:cover;background-position:center}
.card .body{padding:18px 20px 22px}
.card b{display:block;font-size:17px;margin-bottom:4px}
.card p{margin:0;color:#5a6b7d;font-size:14px}
.card .go{display:inline-block;margin-top:12px;font-weight:700;color:#1f5fa8}
.note{margin-top:32px;font-size:13px;color:#5a6b7d}
@media (max-width:640px){.cards{grid-template-columns:1fr}.wrap{padding-top:32px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>株式会社YBF　ホームページ案</h1>
  <p class="lead">2つの案をご用意しました。スマホでもパソコンでもご覧いただけます。気になった点はそのままお伝えください。</p>
  <div class="cards">
    <a class="card" href="a/">
      <div class="thumb" style="background-image:linear-gradient(180deg,rgba(20,18,16,.1),rgba(20,18,16,.75)),url('img/hero.jpg')">A案　高級感・上質</div>
      <div class="body"><b>黒を基調にした、上質な雰囲気の案</b><p>写真を大きく見せ、デザイン性の高さで「仕事の質」を伝えます。</p><span class="go">A案を見る →</span></div>
    </a>
    <a class="card" href="b/">
      <div class="thumb" style="background-image:linear-gradient(180deg,rgba(14,42,76,.1),rgba(14,42,76,.75)),url('img/case-bath.jpg')">B案　信頼感・法人向け</div>
      <div class="body"><b>白を基調にした、きちんとした会社らしい案</b><p>許可・保証・お客様の声・よくある質問など、安心材料を前面に出します。</p><span class="go">B案を見る →</span></div>
    </a>
  </div>
  <p class="note">※どちらも「デモ版」です。写真・数値・一部の文章は仮のもので、実際の施工写真と会社情報に差し替えて公開します。</p>
</div>
</body>
</html>
